name: Update

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Package one release of this channel instead of every current release
        type: choice
        options: ["", stable, beta]
        default: ""
      version:
        description: Exact version to package with the channel above, for example 3.47.7
        default: ""

concurrency:
  group: update
  cancel-in-progress: false

defaults:
  run:
    # An explicit bash adds pipefail, so `nix ... | tee` fails when nix fails.
    shell: bash

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.plan.outputs.releases }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - id: plan
        name: Find channel releases that are not packaged yet
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$CHANNEL" ] && [ -n "$VERSION" ]; then
            releases="$(jq -cn --arg c "$CHANNEL" --arg v "$VERSION" '[{channel: $c, version: $v}]')"
          else
            releases="$(nix run .#updater -- plan --skip-branches-on origin)"
          fi
          echo "releases=$releases" >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    if: needs.plan.outputs.releases != '[]'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.releases) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Package Flutter ${{ matrix.version }}
        env:
          CHANNEL: ${{ matrix.channel }}
          VERSION: ${{ matrix.version }}
        run: nix run .#updater -- update --channel "$CHANNEL" --version "$VERSION" | tee "$RUNNER_TEMP/summary.json"
      - id: body
        name: Describe the change
        run: |
          {
            echo 'body<<EOF'
            echo "Packages Flutter ${{ matrix.version }} (${{ matrix.channel }} channel) from the data nixpkgs' Flutter update script generates."
            echo
            echo '```json'
            cat "$RUNNER_TEMP/summary.json"
            echo '```'
            echo
            echo "CI builds it on Linux and macOS and this merges automatically when it is green. If a patch no longer applies, CI opens an issue; rebase the patch on this branch."
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: update/${{ matrix.channel }}-${{ matrix.version }}
          commit-message: "feat(${{ matrix.channel }}): flutter ${{ matrix.version }}"
          title: "feat(${{ matrix.channel }}): flutter ${{ matrix.version }}"
          body: ${{ steps.body.outputs.body }}
          labels: update
      - name: Run CI and merge when green
        if: steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/start-ci-and-auto-merge.sh "${{ steps.pr.outputs.pull-request-number }}" "${{ steps.pr.outputs.pull-request-head-sha }}"

  nixpkgs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Bump the pinned nixpkgs
        run: nix flake update nixpkgs
      - id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: update/nixpkgs
          commit-message: "chore(nixpkgs): bump pinned nixpkgs"
          title: "chore(nixpkgs): bump pinned nixpkgs"
          body: Moves the pinned nixpkgs to the newest nixpkgs-unstable. CI rebuilds every channel against it; this merges automatically when it is green.
          labels: update
      - name: Run CI and merge when green
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/start-ci-and-auto-merge.sh "${{ steps.pr.outputs.pull-request-number }}" "${{ steps.pr.outputs.pull-request-head-sha }}"
