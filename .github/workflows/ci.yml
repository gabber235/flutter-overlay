name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Per event: a dispatched run must not cancel the pull_request run of the same branch, whose
  # checks are the ones the pull request reports.
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # An explicit bash adds pipefail, so `nix ... | tee` fails when nix fails.
    shell: bash

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Flake checks
        run: nix flake check --print-build-logs --keep-going

      - name: Smoke test each channel
        run: |
          for channel in stable beta; do
            echo "::group::$channel"
            .github/scripts/smoke-test.sh "$channel"
            echo "::endgroup::"
          done
