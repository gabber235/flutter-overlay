name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Per event: a dispatched run must not cancel the pull_request run of the same branch, whose
  # checks are the ones the pull request reports.
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # An explicit bash adds pipefail, so `nix ... | tee` fails when nix fails.
    shell: bash

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # Reads gabber235.cachix.org and, after the job, pushes every path it built there, so
      # consumers download Flutter instead of fetching it themselves. Fork pull requests get no
      # token, so they only read.
      - uses: cachix/cachix-action@v17
        with:
          name: gabber235
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Flake checks
        run: nix flake check --print-build-logs --keep-going

      # Consumers pin exact versions, so every kept release is built and pushed, not only the
      # channel heads the checks build. Each is an archive download, from the cache once pushed.
      - name: Build every kept release
        run: |
          system=$(nix eval --raw --impure --expr builtins.currentSystem)
          # shellcheck disable=SC2046
          nix build --no-link --print-build-logs $(nix eval --raw ".#legacyPackages.$system.versions" \
            --apply 'vs: toString (map (p: "${p.drvPath}^out") (builtins.attrValues vs))')

      - name: Smoke test each channel
        run: |
          for channel in stable beta; do
            echo "::group::$channel"
            .github/scripts/smoke-test.sh "$channel"
            echo "::endgroup::"
          done
